<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Theft Auto VI - Rockstar Games</title>
</head>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poiret+One&display=swap');
  @font-face {
    font-family: 'ArtDeco Bold';
    src: url('fonts/art-deco-bold.otf') format('opentype');
    /* 👈 Make sure path and filename match exactly */
    font-weight: bold;
    font-style: normal;
  }


  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #16172A;
  }

  .top-section {
    display: flex;
    height: 60px;
    position: relative;
    justify-content: center;
    align-items: center;

  }

  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
  }

  p {
    position: absolute;
    color: #3c4066;
    background-color: none;
    font: 15px;
    font-weight: 700;
    line-height: 17px;
    letter-spacing: 2.25px;
    font-family: 'ArtDeco Bold' !important;


  }

  .logo {
    margin: 55px 0 0 55px;
    width: 50px;
    height: 45px;
    color: white;
  }

  .logo svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .hero-section {
    display: flex;
    justify-content: space-between;
  }


  .hero-container {
    width: 1100px;
    height: 600px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 50px auto;
    position: relative;
  }

  .hero-image {
    width: 1200px;
    height: 600px;
    object-fit: fill;
    display: block;
  }

  .overlay {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 400px;
    height: auto;
    object-fit: contain;
  }

  

  .menu-button {
    margin: 55px 55px 0 0;
    width: 48px;
    height: 48px;
    background: transparent;
    border: none;
    cursor: pointer;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }

  .menu-button span {
    width: 40px;
    height: 8px;
    background-color: white;
    display: block;
  }

  .pre-order {
    width: 100%;
    height: 50px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    padding: 10px 20vw;
  }

  .pre-order p {
    font-size: 29px;
    font-weight: 500;
    line-height: 35px;
    letter-spacing: -0.29px;
    color: white;
  }

  .order-button {
    padding: 12px 14px;
    font-size: 22px;
    text-shadow: 1px 0 0 currentColor, 1px 0 0 currentColor;

    background-color: #FFC0D1;
    color: #16172A;
    border: none;
    border-radius: 50px;
    width: 200px;
    font-family: "Poiret One";

  }


</style>

<body>

  <div class="top-section">
    <img src="top-section-1.png" alt="">
    <p>LAUNCH TRAILER NOW PLAYING</p>
  </div>

  <div class="hero-section">
    <div class="logo">
      <svg fill="none" height="100%" width="100%" viewBox="0 0 46 35" xmlns="http://www.w3.org/2000/svg"
        class="_1o5pgyxe _1o5pgyxf _1n4m2yu0" aria-hidden="true" focusable="false">
        <path d="M46.2661 0.800781H34.7236V34.4008H46.2661V0.800781Z" fill="currentColor"></path>
        <path d="M33.9162 0.800781L17.3358 34.4008L0.776855 0.800781H12.3139L17.3332 11.5445L22.3766 0.800781H33.9162Z"
          fill="currentColor"></path>
        <path
          d="M46.9194 1.43945C47.0056 1.43945 47.0488 1.47492 47.0488 1.54585C47.0488 1.60496 47.0155 1.63872 46.9489 1.64712L47.0573 1.81154H46.9939L46.8905 1.65148H46.828V1.81154H46.769V1.43945H46.9192H46.9194ZM46.8959 1.60465C46.9317 1.60465 46.9565 1.59999 46.9698 1.59065C46.9831 1.58132 46.9898 1.56561 46.9898 1.54336C46.9898 1.50541 46.9631 1.48628 46.9099 1.48628H46.8282V1.60465H46.8959Z"
          fill="currentColor"></path>
        <path
          d="M46.8961 1.94775C46.7154 1.94775 46.5684 1.80355 46.5684 1.62622C46.5684 1.44889 46.7154 1.30469 46.8961 1.30469C47.0769 1.30469 47.2239 1.44889 47.2239 1.62622C47.2239 1.80355 47.0769 1.94775 46.8961 1.94775ZM46.8961 1.35509C46.7437 1.35509 46.6196 1.47673 46.6196 1.62638C46.6196 1.77602 46.7436 1.89767 46.8961 1.89767C47.0487 1.89767 47.1727 1.77602 47.1727 1.62638C47.1727 1.47673 47.0487 1.35509 46.8961 1.35509Z"
          fill="currentColor"></path>
      </svg>
    </div>


    <div class="hero-container">
      <img class="hero-image" src="hero-section-poster.jpeg" alt="gtavi-image">
      <img class="overlay" src="gta6-logo.png" alt="gta6-center-logo">


    </div>


    <button class="menu-button" aria-label="Expand Navigation Menu" aria-expanded="false">
      <span></span>
      <span></span>
    </button>

  </div>

 <div class="pre-order">
    <div>
      <p>Coming <br>
        November 19, 2026</p>
    </div>
    <div>
      <button class="order-button" type="button">Pre-Order Now</button>
    </div>
  </div>

 
</body>

</html>
